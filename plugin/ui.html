<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #1e1e1e;
        --panel: #2a2a2a;
        --border: #3c3c3c;
        --text: #e6e6e6;
        --dim: #9a9a9a;
        --ok: #4caf50;
        --err: #e5534b;
        --warn: #d29922;
        --accent: #0d8a72;
        --app-bd-rad: 13px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; font-size: 12px; }
      body { font-family: Inter, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
      body { border: 1px solid #e6e6e6; border-bottom-left-radius: var(--app-bd-rad); border-bottom-right-radius: var(--app-bd-rad); border-top: none; overflow: hidden; }
      header { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
      header .conn { flex: 1; }
      footer { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); flex-shrink: 0; }
      .dot.on { background: var(--ok); }
      #status { flex: 1; color: var(--dim); }
      main { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
      .card.approval { border-color: var(--warn); }
      .card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); margin-bottom: 6px; }
      pre.code { background: #171717; border-radius: 4px; padding: 8px; max-height: 180px; overflow: auto; font-family: Menlo, Consolas, monospace; font-size: 11px; white-space: pre-wrap; }
      pre.logs { max-height: 140px; overflow: auto; font-family: Menlo, Consolas, monospace; font-size: 11px; white-space: pre-wrap; }
      pre.logs .err { color: var(--err); }
      pre.logs .ok { color: var(--ok); }
      .row { display: flex; gap: 8px; margin-top: 8px; }
      button { border: none; border-radius: 4px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
      header button { min-width: 30px; padding: 4px 9px; font-size: 12px; flex-shrink: 0; line-height: 1; text-align: center; }
      .run { background: var(--accent); color: white; }
      .reject { background: #4a4a4a; color: var(--text); }
      .meta { color: var(--dim); margin-top: 6px; }
      /* footer { padding: 8px 12px; border-top: 1px solid var(--border); color: var(--dim); } */
      .conn { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      input[type="number"] { width: 74px; background: #171717; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font-size: 11px; }
      input[type="checkbox"] { width: 13px; height: 13px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
      input[type="number"]:focus { outline: 1px solid var(--accent); }
      .port-label { color: var(--dim); font-size: 11px; }
      .save { background: #3a3a3a; color: var(--text); }
      .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .card-head h3 { flex: 1; margin-bottom: 0; }
      .expand { background: #3a3a3a; color: var(--dim); font-weight: 400; padding: 2px 8px; font-size: 10px; }
      .expand:hover { color: var(--text); }
      pre.code.collapsed { display: none; }
      pre.code.full { max-height: none; }
      /* minimized: footer pinned to 50px; header keeps its natural height;
         the feed is squashed by flex */
      body.minimized footer { height: 50px; }
    </style>
  </head>
  <body>
    <header>
      <div class="conn" title="WebSocket port of figma-mcp (= 10060 + server id). Example: figma-mcp 1 → 10061, figma-mcp 2 → 10062. One plugin connects to one port only — edit the field (Enter) to change it.">
        <span class="port-label">MCP server port</span>
        <input type="number" id="port" min="1" max="65535" step="1" value="10060" />
        <button id="reconnect" class="save" title="Close the current connection and reconnect to the same port">↻</button>
      </div>
      <input type="checkbox" id="validate" title="Validate code" />
      <button id="clear" class="save" title="Remove all log cards from the feed">🗑</button>
      <button id="minmax" class="save" title="Minimize the feed">_</button>
    </header>
    <main id="feed"></main>
    <footer>
      <div class="dot" id="dot"></div>
      <div id="status">Waiting for server config…</div>
    </footer>

    <script>
      // localhost may resolve to ::1 while the server listens on IPv4 → fall back to 127.0.0.1
      const DEFAULT_PORT = 10060;
      let wsPort = DEFAULT_PORT; // port actually in use (main thread sends the persisted value)
      const wsUrls = () => [`ws://localhost:${wsPort}`, `ws://127.0.0.1:${wsPort}`];
      let wsIdx = 0;
      const PING_MS = 3000;
      const RECONNECT_MS = 2500;
      const CONFIG_WAIT_MS = 600; // wait for main to send the saved port, otherwise use the default

      // Auto-run is always ON (no toggle in the UI).
      const dot = document.getElementById("dot");
      const statusEl = document.getElementById("status");
      const feed = document.getElementById("feed");
      const portInput = document.getElementById("port");
      const validateInput = document.getElementById("validate"); // unchecked by default → validation OFF

      let ws = null;
      let pingTimer = null;
      let reconnectTimer = null;
      let wsConnected = false; // compared with the previous open → tells main to re-send hello only on a REAL reconnect
      let serverVersion = null;
      let retryTimer = null;

      function setStatus(on, text) {
        dot.classList.toggle("on", !!on);
        statusEl.textContent = text;
      }

      function connect() {
        const url = wsUrls()[wsIdx % wsUrls().length];        if (!/^\d+$/.test(String(wsPort))) { setStatus(false, "Invalid port"); return; }
        setStatus(false, "Connecting to " + url + "…");
        try { ws = new WebSocket(url); } catch (e) { scheduleReconnect(); return; }
        ws.onopen = () => {
          const reconnected = wsConnected; // not the first open
          wsConnected = true;
          retryMode = "loop"; failedTries = 0; // connected → back to endless retry for future drops
          setStatus(true, "Connected to MCP server");
          wsIdx = 0; // opened fine → next attempt starts from localhost again
          // main needs a fresh hello per WS session → report once the handshake is done
          parent.postMessage({ pluginMessage: { kind: reconnected ? "ws-reconnected" : "ws-connected" } }, "*");
          startPing();
        };
        ws.onmessage = (ev) => {
          let msg; try { msg = JSON.parse(ev.data); } catch { return; }
          if (msg.type === "pong") return;                      // heartbeat handled here
          if (msg.type === "hello" && msg.role === "server") {  // handshake
            if (msg.ok === false && msg.code === "BUSY") {
              // Server still holds the old (half-open) socket — self-heal: close + retry with backoff
              setStatus(false, "Server still holds the old connection — retrying…");
              hardClose();
              scheduleRetry();
            } else if (msg.ok === false && msg.code === "REPLACED") {
              // Another plugin took over this server → stop retrying, wait for a manual Reconnect.
              hardClose();
              replaced();
            } else {
              serverVersion = msg.protocolVersion;
              setStatus(true, "Connected · ws://localhost:" + wsPort + " · protocol v" + serverVersion);
            }
            return;                                            // KHÔNG forward hello/pong xuống main
          }
          if (msg.type === "execute" && msg.id) runCodes.set(msg.id, typeof msg.code === "string" ? msg.code : "");
          parent.postMessage({ pluginMessage: { kind: "ws-message", data: ev.data } }, "*");
        };
        ws.onclose = (ev) => {
          if (!ws) return;
          wsIdx++;
          cleanup();
          // 4001 = server intentionally replaced us with a newer plugin connection.
          // Do NOT auto-reconnect (that would kick the new session and loop forever);
          // the user can press "↻ Reconnect" to take the connection back.
          if (ev && ev.code === 4001) {
            replaced();
            return;
          }
          setStatus(false, "Disconnected — retrying…");
          scheduleReconnect();
        };
        ws.onerror = () => { wsIdx++; cleanup(); /* onclose fires right after */ };
      }
      function cleanup() { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } }
      // retryMode: "loop" = keep retrying the current port forever (startup / Reconnect)
      //            "limited" = user set a new port → after PORT_TRY_LIMIT failures stay Disconnected (no retry, NEVER falls back to the old port)
      let retryMode = "loop";
      let failedTries = 0;
      const PORT_TRY_LIMIT = 3;
      function scheduleReconnect() {
        if (retryMode === "limited" && failedTries >= PORT_TRY_LIMIT) {
          setStatus(false, "Disconnected — no server at port " + wsPort + ". Edit the port or press Reconnect.");
          return;
        }
        failedTries++;
        if (!reconnectTimer) reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, RECONNECT_MS);
      }
      function scheduleRetry() { if (!retryTimer) retryTimer = setTimeout(() => { retryTimer = null; connect(); }, 2000); }

      // Connection was taken over by another plugin instance: no auto-reconnect, show a clear state.
      function replaced() {
        wsConnected = false;
        serverVersion = null;
        clearTimers();
        retryMode = "loop";
        failedTries = 0;
        ws = null;
        setStatus(false, "Replaced by another plugin instance — press ↻ Reconnect to take over.");
      }

      function startPing() {
        if (pingTimer) clearInterval(pingTimer);
        pingTimer = setInterval(() => {
          if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping", t: Date.now() }));
        }, PING_MS);
      }

      function hardClose() {
        // closing the socket without triggering onclose→auto-reconnect (caller schedules it)
        if (ws) { try { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); } catch {}
          ws = null; }
        cleanup();
      }

      // main → ws
      onmessage = (ev) => {
        const m = ev.data && ev.data.pluginMessage;
        if (!m) return;
        switch (m.kind) {
          case "to-ws":
            if (ws && ws.readyState === 1) ws.send(m.payload);
            // echo locally so the user sees log/result of the run
            try {
              const p = JSON.parse(m.payload);
              if (p.type === "log") appendLog(p.id, "[" + p.level + "] " + (p.args || []).join(" "));
              if (p.type === "result") appendLog(p.id, (p.ok ? "✔ done" : "✖ " + p.code + ": " + p.error), p.ok ? "ok" : "err");
            } catch { /* ignore */ }
            break;
          case "connection":
            if (m.status === "busy") setStatus(false, m.message);
            else if (m.status === "connected") setStatus(true, "Connected · ws://localhost:" + wsPort + " · " + m.server);
            else if (m.status === "closed") setStatus(false, "Disconnected — retrying…");
            break;
          case "config": // main sends the persisted port + validate flag (clientStorage)
            applyPort(m.port, { fromMain: true });
            if (typeof m.validate === "boolean") validateInput.checked = m.validate;
            break;
          case "port-changed":
            applyPort(m.port, { fromMain: true });
            break;
          case "approval-request": renderApproval(m); break;
          case "run-started": markRunning(m.id); break;
          case "run-finished": markFinished(m); break;
        }
      };

      // ---------- connection port ----------
      function sanitizePort(v) {
        const n = Math.round(Number(v));
        return Number.isFinite(n) && n >= 1 && n <= 65535 ? n : null;
      }

      function applyPort(raw, opts = {}) {
        const port = sanitizePort(raw);
        if (port === null) {
          portInput.value = String(wsPort);
          setStatus(false, "Invalid port (1–65535)");
          return;
        }
        portInput.value = String(port);
        if (port === wsPort && started) return; // unchanged → keep the connection
        wsPort = port;
        if (!started) { start(); return; }
        // port really changed → drop the old connection and reconnect on the new port
        hardClose();
        clearTimers();
        wsIdx = 0;
        serverVersion = null;
        if (opts.fromMain) {
          connect();
        } else {
          // user action → persist via main (clientStorage) then reconnect on the NEW port only
          parent.postMessage({ pluginMessage: { kind: "set-port", value: port } }, "*");
          retryMode = "limited";
          failedTries = 0;
          connect();
        }
      }

      // ===== Reconnect button: close the current socket and reconnect to the SAME port (endless retry) =====
      const reconnectBtn = document.getElementById("reconnect");
      reconnectBtn.onclick = () => {
        const typed = sanitizePort(portInput.value);
        if (typed !== null && typed !== wsPort) { applyPort(typed); return; } // typed port not applied yet → apply it (limited mode)
        hardClose();
        clearTimers();
        wsIdx = 0;
        serverVersion = null;
        retryMode = "loop";
        failedTries = 0;
        setStatus(false, "Reconnecting…");
        connect(); // onopen reports ws-reconnected → main sends a fresh hello
      };

      // ===== Minimize/restore button: hide the feed and shrink the plugin window =====
      const minmaxBtn = document.getElementById("minmax");
      const ICON_MIN = "_";   // feed visible → click minimizes
      const ICON_MAX = "▢";   // feed hidden → click restores (maximizes)
      const RESIZE_ANIM_MS = 350; // keep in sync with UI_ANIM_MS in main.ts
      const FLIP_EASE = "cubic-bezier(0.2, 0.8, 0.2, 1)"; // same curve as the panel zoom
      const headerEl = document.querySelector("header");
      const footerEl = document.querySelector("footer");
      let minimized = false;

      // .minimized pins header/footer to 50px (auto → 50px is discrete, not transitionable),
      // which shifts their centered children. FLIP it: invert each child's jump with a
      // transform (compositor-only, safe to animate), then glide back — starting the same
      // instant as the window zoom, same duration + easing → header/footer content moves
      // in sync with the feed collapse/expand.
      function flipMinMax(add) {
        const kids = [...headerEl.children, ...footerEl.children];
        const before = kids.map((n) => n.getBoundingClientRect().top);
        document.body.classList.toggle("minimized", add);
        kids.forEach((n, i) => {
          const dy = before[i] - n.getBoundingClientRect().top;
          if (Math.abs(dy) < 0.5) return;
          n.style.transition = "none";
          n.style.transform = "translateY(" + dy + "px)";
          void n.offsetWidth; // force reflow so the inverted position sticks
          n.style.transition = "transform " + RESIZE_ANIM_MS + "ms " + FLIP_EASE;
          n.style.transform = "";
        });
      }

      minmaxBtn.onclick = () => {
        minimized = !minimized;
        minmaxBtn.textContent = minimized ? ICON_MAX : ICON_MIN;
        minmaxBtn.title = minimized ? "Restore the feed" : "Minimize the feed";
        flipMinMax(minimized); // heights + child glide apply BEFORE the window starts shrinking
        parent.postMessage({ pluginMessage: { kind: "minimize", minimized } }, "*");
      };

      // ===== Validate-code toggle: enable/disable validateAndInstrument in the main thread =====
      validateInput.onchange = () => {
        parent.postMessage({ pluginMessage: { kind: "set-validate", value: validateInput.checked } }, "*");
      };

      // ===== Clear button: drop every log card from the feed =====
      const clearBtn = document.getElementById("clear");
      clearBtn.onclick = () => {
        feed.textContent = "";
        cards.clear();
        runCodes.clear();
      };

      function clearTimers() {
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      }

      portInput.onkeydown = (ev) => { if (ev.key === "Enter") applyPort(portInput.value); };

      // ---------- render ----------
      const cards = new Map();
      const runCodes = new Map(); // execution id → full code sent by the server (for the expand button)

      function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

      function ensureRunCard(id) {
        if (cards.has(id)) return cards.get(id);
        const card = el("div", "card");
        const head = el("div", "card-head");
        head.appendChild(el("h3", null, "Execution " + id));
        const expandBtn = el("button", "expand", "⤢ Code");
        const code = el("pre", "code collapsed full", runCodes.get(id) || "(code not captured)");
        expandBtn.onclick = () => {
          const open = !code.classList.toggle("collapsed");
          code.classList.toggle("full", open);
          if (open) {
            const src = runCodes.get(id);
            if (src != null) code.textContent = src;
          }
          expandBtn.textContent = open ? "⤡ Hide" : "⤢ Code";
        };
        head.appendChild(expandBtn);
        card.appendChild(head);
        card.appendChild(code);
        const logs = el("pre", "logs");
        card.appendChild(logs);
        feed.appendChild(card);
        const entry = { card, logs, code, expandBtn };
        cards.set(id, entry);
        return entry;
      }

      function appendLog(id, line, cls) {
        const c = ensureRunCard(id);
        const span = el("span", cls, line + "\n");
        c.logs.appendChild(span);
        c.logs.scrollTop = c.logs.scrollHeight;
      }

      function renderApproval(m) {
        const card = el("div", "card approval");
        const head = el("div", "card-head");
        head.appendChild(el("h3", null, "⚠ Approval required — " + m.file));
        card.appendChild(head);
        const code = el("pre", "code full", m.code);
        card.appendChild(code);
        card.appendChild(el("div", "meta", "timeout " + m.limits.timeoutMs + "ms · max " + m.limits.maxNodes + " nodes · " + m.limits.maxCommands + " commands"));
        const row = el("div", "row");
        const runBtn = el("button", "run", "Run");
        const rejectBtn = el("button", "reject", "Reject");
        runBtn.onclick = () => { parent.postMessage({ pluginMessage: { kind: "approval", id: m.id, approved: true } }, "*"); row.remove(); appendLog(m.id, "▶ started by user", "ok"); };
        rejectBtn.onclick = () => { parent.postMessage({ pluginMessage: { kind: "approval", id: m.id, approved: false } }, "*"); row.remove(); appendLog(m.id, "✖ rejected by user", "err"); };
        row.appendChild(runBtn); row.appendChild(rejectBtn);
        card.appendChild(row);
        const logs = el("pre", "logs");
        card.appendChild(logs);
        feed.appendChild(card);
        cards.set(m.id, { card, logs, code });
      }
      function markRunning(id) {
        const entry = cards.get(id);
        if (entry && entry.card.classList.contains("approval")) entry.card.classList.remove("approval");
      }
      function markFinished(m) {
        appendLog(m.id, m.ok ? "✔ " + m.summary : "✖ " + m.summary, m.ok ? "ok" : "err");
      }

      // ---------- start: wait for main to report the saved port (fall back to the default after CONFIG_WAIT_MS) ----------
      let started = false;
      function start() {
        if (started) return;
        started = true;
        connect();
      }
      setTimeout(() => {
        if (!started) applyPort(DEFAULT_PORT);
      }, CONFIG_WAIT_MS);
    </script>
  </body>
</html>
